<style>

    width:100%;
    height:190px;
    object-fit:cover;
}

}

<script>
function loadPage(page) {
  try {
      console.log('la pagina es:',page);
       fetch(page + ".html")
         .then(res => res.text())
         .then(data => {
             console.log('la data es:',data);
           document.getElementById("content").innerHTML = data;
         });
  } catch (error) {
    console.log('el error es:', error);
  }
}

</script>
